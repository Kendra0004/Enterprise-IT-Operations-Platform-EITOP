name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eitop
          POSTGRES_PASSWORD: eitop
          POSTGRES_DB: eitop_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eitop"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SECRET_KEY: ci-secret-key-not-for-production-0123456789
      APP_ENV: testing
      DATABASE_URL: postgresql+psycopg://eitop:eitop@localhost:5432/eitop_test
      TEST_DATABASE_URL: postgresql+psycopg://eitop:eitop@localhost:5432/eitop_test
      REDIS_URL: redis://localhost:6379/1
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      # Phase 6 audit: third-party actions pinned to full commit SHAs —
      # mutable tags can be moved (and were, historically) to inject code
      # into every build. Comments record the tag each SHA resolves to.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
        working-directory: backend
      - name: Dependency audit (pip-audit)
        # Prod + dev requirements; fails the job on known CVEs (Phase 6 §11
        # was run ad-hoc — CI now enforces it on every push).
        run: pip install pip-audit && pip-audit -r requirements.txt -r requirements-dev.txt
        working-directory: backend
      - name: Ruff
        run: ruff check --no-cache app tests
        working-directory: backend
      - name: Mypy
        run: mypy app
        working-directory: backend
        env:
          MYPY_CACHE_DIR: /tmp/mypy-cache
      - name: Pytest
        run: pytest --cov=app --cov-report=term-missing
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        # Lockfile-only install: `|| npm install` silently regenerated the
        # lockfile when it drifted, making CI results unreproducible.
        run: npm ci
        working-directory: frontend
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: frontend
      - name: Test
        run: npm test
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
      - name: Audit (high+)
        # Hard gate: `|| true` made the audit informational only.
        run: npm audit --audit-level=high
        working-directory: frontend

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build backend image
        run: docker build -t eitop-backend:ci backend
      - name: Trivy scan backend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: eitop-backend:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      # Phase 6 audit F-002: the frontend (nginx) image was never scanned and
      # shipped 68 fixable HIGH/CRITICAL CVEs on an EOL alpine base.
      - name: Build frontend image
        run: docker build -t eitop-frontend:ci frontend
      - name: Trivy scan frontend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: eitop-frontend:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
