# EITOP edge reverse proxy (production) — terminating TLS.
#
# Topology (single proxy hop for API traffic, so the trusted
# X-Forwarded-For can be OVERWRITTEN once at the edge):
#
#   client ──HTTPS──► nginx:443 ──/api,/health────────► backend:8000
#                        └──────/ (static SPA)────────► frontend:8080
#
# /docs and /openapi.json are intentionally NOT routed at the edge
# (Phase 6 audit F14): the backend disables them in production, and
# not proxying them keeps the surface closed even if APP_ENV is
# misconfigured.

# HTTP → HTTPS redirect.
# Do not advertise the nginx version in Server/banner (Phase 6 audit F17) —
# file top level is the http{} context, so this applies to every server.
server_tokens off;
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # --- TLS (place fullchain.pem + privkey.pem in ./certs) ---------------
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS — after verifying HTTPS works end to end, consider 2 years.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Inventory payloads can reach several MB (5 MB API cap + headroom).
    client_max_body_size 10m;

    # --- API / backend ----------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;   # sync-test endpoints may take a while
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # --- Static SPA (frontend container adds its own security headers) ----
    location / {
        proxy_pass http://frontend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}