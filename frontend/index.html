<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EITOP — Enterprise IT Operations Platform" />
    <title>EITOP</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Apply the stored theme before first paint (no flash of wrong theme).
      (function () {
        try {
          var t = localStorage.getItem("eitop.theme");
          var dark = t === "light" ? false : true; // default: dark
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
