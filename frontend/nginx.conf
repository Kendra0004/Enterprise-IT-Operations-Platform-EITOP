server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # One authoritative request-size chain: edge and this proxy both allow
    # 10m; the backend enforces its own per-route limits (5m inventory)
    # and answers 413 — nginx must never clip a payload the backend would
    # have accepted (Phase 6 audit F1).
    client_max_body_size 10m;
    # Do not advertise the nginx version in Server/banner (F17).
    server_tokens off;

    # Security headers (applied to every response, including proxied API)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-1LDIHTAUaj7e6GNCe1lajMEjF9cH0MsxpGae0NnPx0M='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # ^ The sha256 hash allows ONLY the inline pre-paint theme bootstrap in
    # index.html (keeps no-flash behavior under script-src 'self'). If that
    # script's text changes, recompute:
    #   python3 -c "import re,hashlib,base64; c=re.search(r'<script>(.*?)</script>', open('index.html').read(), re.S).group(1); print('sha256-'+base64.b64encode(hashlib.sha256(c.encode()).digest()).decode())"

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend service (internal network only).
    # X-Forwarded-For is OVERWRITTEN (not appended) so the backend's
    # rate limiter sees the real client IP and cannot be spoofed by a
    # request that already carries an attacker-chosen header.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    # /docs and /openapi.json are deliberately NOT proxied (Phase 6 audit
    # F14): the dev/demo stack binds 0.0.0.0, and exposing Swagger UI
    # there publishes the full route surface with try-it-out. The docs
    # remain available on the backend directly (127.0.0.1:8000/docs) and
    # are disabled outright in production by the app itself.
}
