[project]
name = "eitop-backend"
version = "0.1.0"
description = "EITOP backend — Enterprise IT Operations Platform API"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "email-validator>=2.2,<3.0",
    "sqlalchemy>=2.0.35,<2.1",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "redis>=6.1,<7.0",
    "celery>=5.4,<6.0",
    "packaging>=24.0,<26.0",
    "argon2-cffi>=23.1,<26.0",
    "pyjwt>=2.9,<3.0",
    "ldap3>=2.9,<3.0",
    "cryptography>=42,<46",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-cov>=5.0,<7.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.13,<2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["celery.*", "argon2.*", "ldap3.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Bare `pytest` (CI) does not put cwd on sys.path like `python -m pytest`
# does; tests import `tests.conftest`, so rootdir must be importable.
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "integration: requires PostgreSQL + Redis running",
]

[tool.coverage.run]
source = ["app"]
branch = true
