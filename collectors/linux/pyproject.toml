[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eitop-collector"
version = "0.1.0"
description = "EITOP Linux endpoint collector: enrollment, heartbeat, inventory submission"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27,<1.0",
    "psutil>=5.9,<8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10.0",
]

[project.scripts]
eitop-collector = "eitop_collector.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
